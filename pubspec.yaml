name: smart_retry
description: >-
  A production-ready retry library for Dart and Flutter featuring exponential backoff, advanced jitter strategies, conditional retries, typed exceptions, event streams, and zero-boilerplate async resilience.

version: 1.0.0
homepage: https://github.com/Brah-Timo/smart_retry
repository: https://github.com/Brah-Timo/smart_retry
issue_tracker: https://github.com/Brah-Timo/smart_retry/issues
documentation: https://pub.dev/documentation/smart_retry/latest/

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  meta: ^1.9.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0

topics:
  - retry
  - backoff
  - network
  - resilience
  - http
